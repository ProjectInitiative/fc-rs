[package]
name = "fc-rs"
version = "0.1.0"
edition = "2021"
description = "Fast block-order copy with dedup — Rust native port of fast-copy"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
rayon = "1"
indicatif = "0.17"
tar = "0.4"
flate2 = "1"
ssh2 = "0.9"
nix = { version = "0.29", features = ["ioctl", "fs"] }
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
anyhow = "1"
thiserror = "1"
globset = "0.4"
same-file = "1"
filetime = "0.2"
libc = "0.2"
once_cell = "1"
rpassword = "7"
shlex = "1"
whoami = "1"
regex = "1"
zstd = { version = "0.13", features = ["experimental"] }
crossbeam-channel = "0.5"
